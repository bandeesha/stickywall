<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Feedback wall</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #1b3a2f;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .header {
    position: fixed; top: 0; left: 0; right: 0;
    padding: 24px 40px; color: #fff; opacity: 0.85;
    font-size: 28px; font-weight: 600;
    background: linear-gradient(to bottom, rgba(0,0,0,0.35), transparent);
    z-index: 10;
  }

  .lanes {
    position: absolute; top: 110px; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column; justify-content: space-around;
  }
  .lane-outer {
    position: relative; width: 100%; height: 45%;
    overflow: hidden;
  }
  .lane-track {
    position: absolute; top: 50%; left: 0;
    display: flex; align-items: center; gap: 26px;
    will-change: transform;
    transform: translateY(-50%);
  }

  .note {
    flex: 0 0 auto;
    width: 260px; height: 200px;
    padding: 14px; border-radius: 4px;
    font-family: 'Comic Sans MS', 'Marker Felt', cursive, sans-serif;
    font-size: 22px; line-height: 1.3; color: #333;
    box-shadow: 4px 6px 14px rgba(0,0,0,0.35);
    display: flex; align-items: center; justify-content: center;
    word-wrap: break-word; overflow: hidden;
  }
  .note img {
    width: 100%; height: 100%; object-fit: contain; pointer-events: none;
  }
  .yellow { background: #fdf07a; }
  .pink   { background: #ffb3c6; }
  .green  { background: #b7f0a3; }
  .blue   { background: #a3d8f0; }
  .orange { background: #ffc98a; }

  .empty {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: rgba(255,255,255,0.5); font-size: 26px;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="header">💬 Feedback wall</div>

  <div class="lanes" id="lanesContainer">
    <div class="lane-outer"><div class="lane-track" id="lane1"></div></div>
    <div class="lane-outer"><div class="lane-track" id="lane2"></div></div>
  </div>

  <div class="empty" id="emptyMsg">No notes yet — grab an iPad and leave one!</div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    // Notes alternate between two lanes: lane1 scrolls left -> right,
    // lane2 scrolls right -> left. The scroll itself is driven by
    // requestAnimationFrame using plain pixel offsets, NOT CSS keyframes,
    // so adding a new note never restarts or jumps the animation -
    // it just keeps flowing continuously at a constant speed.

    const NOTE_WIDTH = 260;
    const NOTE_GAP = 26;
    const ITEM_SPAN = NOTE_WIDTH + NOTE_GAP;
    const PIXELS_PER_SECOND = 60;

    const lane1El = document.getElementById("lane1");
    const lane2El = document.getElementById("lane2");

    let lane1Notes = [];
    let lane2Notes = [];
    let lane1Width = 0;
    let lane2Width = 0;
    let lane1Pos = 0; // 0..lane1Width, keeps counting up continuously
    let lane2Pos = 0; // 0..lane2Width

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function noteHtml(note) {
      const rotation = (Math.random() * 6 - 3).toFixed(1);
      const content = note.image
        ? `<img src="${note.image}" alt="" />`
        : escapeHtml(note.text || "");
      return `<div class="note ${note.color || "yellow"}" style="transform:rotate(${rotation}deg)">${content}</div>`;
    }

    // Renders the lane's DOM. If the notes don't fill the screen width on
    // their own, the list is repeated enough times first so there's never
    // a blank gap - then that filled list is duplicated back-to-back so
    // the loop point is invisible. Returns the width of ONE filled copy.
    function renderLaneDom(laneEl, notes) {
      if (notes.length === 0) {
        laneEl.innerHTML = "";
        return 0;
      }

      const screenWidth = document.documentElement.clientWidth;
      const singleWidth = notes.length * ITEM_SPAN;
      const repeats = Math.max(1, Math.ceil(screenWidth / singleWidth) + 1);

      let filledNotes = [];
      for (let i = 0; i < repeats; i++) {
        filledNotes = filledNotes.concat(notes);
      }

      const html = filledNotes.map(noteHtml).join("");
      laneEl.innerHTML = html + html;
      return filledNotes.length * ITEM_SPAN;
    }

    function renderAll() {
      const total = lane1Notes.length + lane2Notes.length;
      document.getElementById("emptyMsg").style.display = total === 0 ? "block" : "none";
      document.getElementById("lanesContainer").style.display = total === 0 ? "none" : "flex";

      lane1Width = renderLaneDom(lane1El, lane1Notes);
      lane2Width = renderLaneDom(lane2El, lane2Notes);

      // Keep the running position sane if a lane just went from empty to
      // populated, or shrank (wall cleared, etc).
      if (lane1Width > 0) lane1Pos = lane1Pos % lane1Width;
      if (lane2Width > 0) lane2Pos = lane2Pos % lane2Width;
    }

    function assignToLane(note) {
      const total = lane1Notes.length + lane2Notes.length;
      if (total % 2 === 0) {
        lane1Notes.push(note);
      } else {
        lane2Notes.push(note);
      }
    }

    // Animation loop - runs continuously, independent of socket events.
    let lastTime = null;
    function tick(now) {
      if (lastTime === null) lastTime = now;
      const dt = (now - lastTime) / 1000;
      lastTime = now;

      const step = PIXELS_PER_SECOND * dt;

      if (lane1Width > 0) {
        // lane1 moves left -> right, so it enters fully shifted left
        // and travels toward 0, wrapping back to -lane1Width.
        lane1Pos = (lane1Pos + step) % lane1Width;
        const translateX = -(lane1Width - lane1Pos);
        lane1El.style.transform = `translateY(-50%) translate3d(${translateX}px,0,0)`;
      }

      if (lane2Width > 0) {
        // lane2 moves right -> left: starts at 0, travels toward
        // -lane2Width, wraps back to 0.
        lane2Pos = (lane2Pos + step) % lane2Width;
        const translateX = -lane2Pos;
        lane2El.style.transform = `translateY(-50%) translate3d(${translateX}px,0,0)`;
      }

      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    // Load existing notes when this display connects/reconnects
    socket.on("history", (notes) => {
      lane1Notes = [];
      lane2Notes = [];
      notes.forEach(assignToLane);
      renderAll();
    });

    // New note posted live from an iPad - just adds to the DOM, the
    // scroll position and speed are completely unaffected.
    socket.on("new_note", (note) => {
      assignToLane(note);
      renderAll();
    });

    socket.on("wall_cleared", () => {
      lane1Notes = [];
      lane2Notes = [];
      lane1Pos = 0;
      lane2Pos = 0;
      renderAll();
    });
  </script>
</body>
</html>
